<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <!-- Aurora Iris gradient: matches the site's primary → secondary accent -->
    <linearGradient id="auroraGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#9382F8;stop-opacity:1" />
      <stop offset="55%" style="stop-color:#B98BEF;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#D994E6;stop-opacity:1" />
    </linearGradient>

    <radialGradient id="nodeGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#F3E9C7;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#EFC57B;stop-opacity:0.4" />
    </radialGradient>

    <filter id="softGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="1.4" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Rounded square backdrop -->
  <rect x="2" y="2" width="60" height="60" rx="15" fill="#0D0A14"/>
  <rect x="2" y="2" width="60" height="60" rx="15" fill="url(#auroraGrad)" opacity="0.92"/>

  <!-- NM initials, Sora-style bold display type -->
  <text x="32" y="41" text-anchor="middle" fill="#FCFBFF" font-family="'Sora', 'SF Pro Display', -apple-system, system-ui, sans-serif" font-weight="800" font-size="25" letter-spacing="-0.5">NM</text>

  <!-- Neural-node accent: small connected triangle, the "agent" signature -->
  <g opacity="0.85">
    <line x1="14" y1="15" x2="21" y2="21" stroke="#FCFBFF" stroke-width="1.1" stroke-linecap="round" opacity="0.55"/>
    <line x1="21" y1="21" x2="15" y2="24" stroke="#FCFBFF" stroke-width="1.1" stroke-linecap="round" opacity="0.4"/>
    <circle cx="14" cy="15" r="1.6" fill="#FCFBFF"/>
    <circle cx="21" cy="21" r="1.6" fill="#FCFBFF"/>
    <circle cx="15" cy="24" r="1.3" fill="#FCFBFF" opacity="0.8"/>
  </g>

  <!-- Live status pulse dot: the champagne "active system" motif used site-wide -->
  <circle cx="49" cy="49" r="4.4" fill="url(#nodeGlow)" filter="url(#softGlow)"/>
  <circle cx="49" cy="49" r="2.2" fill="#EFC57B"/>

  <!-- Subtle inner border for definition -->
  <rect x="2" y="2" width="60" height="60" rx="15" fill="none" stroke="rgba(255,255,255,0.18)" stroke-width="1"/>
</svg>
