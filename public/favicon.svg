<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <!-- Primary gradient - matches portfolio theme (blue to cyan to green) -->
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3b82f6;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#06b6d4;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#10b981;stop-opacity:1" />
    </linearGradient>
    
    <!-- Accent gradient for highlights -->
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#06b6d4;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#10b981;stop-opacity:1" />
    </linearGradient>
    
    <!-- Glow effect for tech aesthetic -->
    <filter id="softGlow">
      <feGaussianBlur stdDeviation="1.5" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Background with rounded corners - modern and clean -->
  <rect x="3" y="3" width="58" height="58" rx="13" fill="url(#primaryGrad)"/>
  
  <!-- Code brackets framing the initials - represents software engineering -->
  <text x="10" y="36" fill="white" font-family="'Courier New', 'Fira Code', 'Consolas', monospace" font-weight="700" font-size="18" opacity="0.95" filter="url(#softGlow)">&lt;</text>
  <text x="54" y="36" fill="white" font-family="'Courier New', 'Fira Code', 'Consolas', monospace" font-weight="700" font-size="18" opacity="0.95" filter="url(#softGlow)">/&gt;</text>
  
  <!-- N and M initials - bold, modern typography -->
  <text x="32" y="40" text-anchor="middle" fill="white" font-family="'Inter', 'SF Pro Display', -apple-system, system-ui, sans-serif" font-weight="900" font-size="26" letter-spacing="-1.2" filter="url(#softGlow)">NM</text>
  
  <!-- Terminal prompt indicator - small accent dot -->
  <circle cx="32" cy="48" r="1.8" fill="url(#accentGrad)" opacity="0.9"/>
  
  <!-- Subtle border for definition -->
  <rect x="3" y="3" width="58" height="58" rx="13" fill="none" stroke="rgba(255,255,255,0.2)" stroke-width="1"/>
  
  <!-- Optional: Small code symbol accents -->
  <circle cx="20" cy="20" r="1" fill="rgba(255,255,255,0.4)"/>
  <circle cx="44" cy="20" r="1" fill="rgba(255,255,255,0.4)"/>
</svg>
